<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A120B">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="description" content="A map that only opens for those who say the words.">
<title>The Marauder's Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Homemade+Apple&display=swap">
<style>
/* An inked map on old parchment. Closed: a folded sheet that only answers to the spoken words. Open: the folds swing
   out, ink draws the corridors, names appear on little banners and footprints walk between rooms. Everything here is
   drawn for this page; the locations are made up. */
:root {
  --night: #1A120B; --night-2: #0F0A06;
  --parch: #E9D7B0; --parch-2: #DCC392; --parch-3: #C9A86D; --edge: #8A6A3B;
  --ink: #3B2414; --ink-soft: rgba(59, 36, 20, .62); --ink-faint: rgba(59, 36, 20, .3);
  --blood: #6E1E14;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: radial-gradient(ellipse at 50% 30%, #2A1C10 0%, var(--night) 55%, var(--night-2) 100%);
  color: var(--parch); font-family: "IM Fell English", Georgia, serif; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 14px 40px; gap: 22px; }

/* ---------- the folded map (closed) ---------- */
.book { position: relative; width: min(560px, 92vw); aspect-ratio: 3 / 4; perspective: 1800px; }
.leaf {
  position: absolute; inset: 0; border-radius: 3px;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,255,255,.35), transparent 45%),
    radial-gradient(ellipse at 80% 90%, rgba(120,80,30,.35), transparent 50%),
    radial-gradient(ellipse at 60% 40%, rgba(140,95,40,.18), transparent 60%),
    linear-gradient(160deg, var(--parch) 0%, var(--parch-2) 55%, var(--parch-3) 100%);
  box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 60px rgba(110,70,25,.45), inset 0 0 6px rgba(80,50,20,.6);
  filter: url(#grain);
}
.cover { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 9% 9%; color: var(--ink); }
.cover .crest { width: 34%; opacity: .9; }
.cover h1 { font-family: "IM Fell English SC", serif; font-weight: 400; font-size: clamp(30px, 7.4vw, 46px); line-height: 1.02; margin: 10px 0 6px; letter-spacing: .02em; }
.cover p { font-style: italic; font-size: clamp(15px, 3.6vw, 19px); color: var(--ink-soft); margin: 4px 0; }
.cover .hand { font-family: "Homemade Apple", cursive; font-size: clamp(13px, 3.2vw, 17px); color: var(--ink); margin-top: 18px; min-height: 2.6em; line-height: 1.7; }
.ink-write { display: inline-block; white-space: pre-wrap; }
.ink-write span { opacity: 0; filter: blur(2px); transition: opacity .35s ease, filter .5s ease; }
.ink-write span.on { opacity: 1; filter: blur(0); }
.fold-lines { position: absolute; inset: 0; pointer-events: none; background:
  linear-gradient(90deg, transparent 32.9%, rgba(90,60,25,.25) 33.3%, transparent 33.8%, transparent 66.2%, rgba(90,60,25,.25) 66.6%, transparent 67%); }

/* ---------- the open map ---------- */
.map-wrap { position: relative; width: min(1180px, 96vw); display: none; perspective: 2200px; }
.map-wrap.show { display: block; }
.panels { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; transform-style: preserve-3d; }
.panel { position: relative; aspect-ratio: 2 / 5; transform-style: preserve-3d; transition: transform 1.25s cubic-bezier(.2,.75,.15,1); }
.panel .leaf { box-shadow: 0 25px 50px rgba(0,0,0,.5), inset 0 0 50px rgba(110,70,25,.4); }
.panel.l { transform-origin: right center; transform: rotateY(178deg); }
.panel.r { transform-origin: left center; transform: rotateY(-178deg); }
.map-wrap.unfolded .panel.l, .map-wrap.unfolded .panel.r { transform: rotateY(0deg); }
.panel.l .leaf { border-radius: 3px 0 0 3px; } .panel.r .leaf { border-radius: 0 3px 3px 0; } .panel.c .leaf { border-radius: 0; }
.drawing { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map-wrap.unfolded .drawing { pointer-events: auto; touch-action: none; cursor: grab; }
.st-major { fill: none; stroke: var(--ink); stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
.st-mid { fill: none; stroke: var(--ink-soft); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; }
.st-minor { fill: none; stroke: var(--ink-faint); stroke-width: .55; stroke-linecap: round; }
.park { fill: url(#hatch); stroke: var(--ink-soft); stroke-width: .9; }
.water { fill: url(#waves); stroke: var(--ink-soft); stroke-width: .9; }
.coast { fill: none; stroke: var(--ink); stroke-width: 1.8; }
.frame { fill: none; stroke: var(--ink); stroke-width: 2; } .frame.thin { stroke-width: .8; stroke: var(--ink-soft); }
.label.hood { font-family: "IM Fell English SC", serif; font-size: 15px; fill: var(--ink); letter-spacing: .06em; paint-order: stroke; stroke: rgba(233,215,176,.85); stroke-width: 4px; }
.label.park { font-style: italic; font-size: 14px; fill: var(--ink-soft); paint-order: stroke; stroke: rgba(233,215,176,.8); stroke-width: 3px; }
.cartouche { fill: rgba(233,215,176,.92); stroke: var(--ink); stroke-width: 1.4; }
.carto-title { font-family: "IM Fell English SC", serif; font-size: 26px; }
.carto-sub { font-style: italic; font-size: 13px; fill: var(--ink-soft); }
.compass { fill: rgba(233,215,176,.7); stroke: var(--ink); stroke-width: 1.2; }
.compass-star { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.banner .tails { fill: var(--parch-2); stroke: var(--ink); stroke-width: 1; }

svg text { font-family: "IM Fell English", serif; fill: var(--ink); }
.room { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: url(#wobble); }
.room.thin { stroke-width: 1.2; stroke: var(--ink-soft); }
.room.dash { stroke-dasharray: 2 7; stroke-width: 1.6; }
.draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); transition: stroke-dashoffset 2.4s ease-in-out; }
.inked .draw { stroke-dashoffset: 0; }
.closing .draw { transition-duration: 1.1s; stroke-dashoffset: var(--len, 2000); }
.label { font-size: 22px; letter-spacing: .02em; opacity: 0; transition: opacity 1.2s ease 1.2s; }
.label.small { font-size: 15px; font-style: italic; fill: var(--ink-soft); }
.label.big { font-family: "IM Fell English SC", serif; font-size: 34px; }
.inked .label { opacity: 1; }
.closing .label { opacity: 0; transition-delay: 0s; transition-duration: .6s; }
.walkers { opacity: 0; transition: opacity 1s ease 2.2s; }
.inked .walkers { opacity: 1; }
.closing .walkers { opacity: 0; transition: opacity .4s; }
.foot { fill: var(--ink); }
.banner rect { fill: var(--parch); stroke: var(--ink); stroke-width: 1.4; }
.banner text { font-family: "Homemade Apple", cursive; font-size: 11px; }

/* ---------- the incantation ---------- */
.spell { width: min(560px, 92vw); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.wand {
  border: 1px solid rgba(233,215,176,.35); background: rgba(233,215,176,.06); color: var(--parch);
  font: inherit; font-size: 19px; letter-spacing: .02em; padding: 12px 22px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px; transition: background .2s, box-shadow .2s;
}
.wand:hover { background: rgba(233,215,176,.12); }
.wand:focus-visible { outline: 2px solid var(--parch-3); outline-offset: 3px; }
.wand.listening { box-shadow: 0 0 0 6px rgba(233,215,176,.08), 0 0 28px rgba(233,215,176,.35); animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 10px rgba(233,215,176,.05), 0 0 40px rgba(233,215,176,.5); } }
.heard { font-style: italic; color: rgba(233,215,176,.8); min-height: 1.5em; font-size: 18px; }
.hint { font-size: 14px; color: rgba(233,215,176,.5); }
.typed { display: none; gap: 8px; width: 100%; }
.typed.show { display: flex; }
.typed input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid rgba(233,215,176,.4); color: var(--parch);
  font: italic 19px "IM Fell English", serif; padding: 8px 4px; outline: none; }
.typed button { background: none; border: 0; color: var(--parch-3); font: inherit; font-size: 17px; cursor: pointer; }
.shake { animation: shake .45s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.note { font-family: "Homemade Apple", cursive; color: var(--parch-2); font-size: 15px; min-height: 1.6em; }
@media (prefers-reduced-motion: reduce) {
  .panel, .draw, .label, .walkers { transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .08  0 0 0 .22 0" result="g"/>
    <feComposite in="g" in2="SourceGraphic" operator="in" result="gg"/><feBlend in="SourceGraphic" in2="gg" mode="multiply"/></filter>
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="3.2"/></filter>
</svg>

<div class="stage">
  <div class="book" id="book" aria-live="polite">
    <div class="leaf cover">
      <svg class="crest" viewBox="0 0 120 120" aria-hidden="true">
        <g fill="none" stroke="#3B2414" stroke-width="2" stroke-linecap="round" filter="url(#wobble)">
          <circle cx="60" cy="60" r="50"/><circle cx="60" cy="60" r="43" stroke-width="1" stroke-dasharray="2 5"/>
          <path d="M60 18 L66 54 L102 60 L66 66 L60 102 L54 66 L18 60 L54 54 Z"/>
          <path d="M60 36 L60 84 M36 60 L84 60" stroke-width="1"/>
        </g>
        <text x="60" y="13" text-anchor="middle" font-size="9" fill="#3B2414" font-family="IM Fell English SC">N</text>
      </svg>
      <h1>The Marauder's Map</h1>
      <p>of the city by the bay, its streets and its comings and goings</p>
      <div class="hand"><span class="ink-write" id="coverInk"></span></div>
    </div>
    <div class="fold-lines"></div>
  </div>

  <div class="map-wrap" id="map">
    <div class="panels">
      <div class="panel l"><div class="leaf"></div></div>
      <div class="panel c"><div class="leaf"></div></div>
      <div class="panel r"><div class="leaf"></div></div>
    </div>
    <svg class="drawing" id="ink" viewBox="0 0 1200 1000" preserveAspectRatio="none" aria-label="Map of San Francisco"></svg>
  </div>

  <div class="spell">
    <button class="wand" id="wand" type="button">✦ <span id="wandLabel">Speak the words</span></button>
    <div class="heard" id="heard"></div>
    <div class="typed" id="typed">
      <input id="typedIn" placeholder="…or write the words" autocomplete="off" aria-label="The words">
      <button id="typedGo" type="button">Say it</button>
    </div>
    <div class="note" id="note"></div>
    <div class="hint" id="hint">It only opens for those who know what to say.</div>
  </div>
</div>

<script src="realm.js"></script>
<script>
// ---------- the words ----------
const OPEN = /solemnly\s+swear.*(up\s+to\s+)?no\s+good/i;
const CLOSE = /mischief\s+managed?/i;
const norm = (s) => s.toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();

// ---------- the realm: San Francisco, from the Presidio to the Embarcadero (OpenStreetMap, inked by hand-ish) ----------
// Streets, parks, water and names are real (realm.js, built by scripts/marauders-build.py). The wanderers are MOCK:
// made-up names walking real streets, until we decide what the map should really follow.
const WALKERS = [
  { name: "Anton", speed: 24 }, { name: "A Curious Cat", speed: 15 },
  { name: "The Night Courier", speed: 30 }, { name: "A Wandering Scholar", speed: 12 },
].map((w) => {
  const r = REALM.routes[w.name];
  return { ...w, path: r.concat(r.slice(0, -1).reverse()) };  // there and back again
});

const $ = (s) => document.querySelector(s);
const ink = $("#ink");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent = ink) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }

let revealCircle, walkLayer, raf = 0, last = 0;
function drawRealm() {
  ink.innerHTML = "";
  const defs = el("defs", {});
  const hatch = el("pattern", { id: "hatch", width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(35)" }, defs);
  el("line", { x1: 0, y1: 0, x2: 0, y2: 7, stroke: "rgba(59,36,20,.38)", "stroke-width": 1.1 }, hatch);
  const waves = el("pattern", { id: "waves", width: 22, height: 9, patternUnits: "userSpaceOnUse" }, defs);
  el("path", { d: "M0 5 Q 5.5 1 11 5 T 22 5", fill: "none", stroke: "rgba(59,36,20,.35)", "stroke-width": 0.9 }, waves);
  const mask = el("mask", { id: "reveal", maskUnits: "userSpaceOnUse", x: -200, y: -200, width: 1600, height: 1400 }, defs);
  el("rect", { x: -200, y: -200, width: 1600, height: 1400, fill: "black" }, mask);
  revealCircle = el("circle", { cx: 600, cy: 500, r: 0, fill: "white", filter: "url(#bleed)" }, mask);
  const bleed = el("filter", { id: "bleed", x: "-20%", y: "-20%", width: "140%", height: "140%" }, defs);
  el("feTurbulence", { type: "fractalNoise", baseFrequency: ".018", numOctaves: 3, seed: 11, result: "t" }, bleed);
  el("feDisplacementMap", { in: "SourceGraphic", in2: "t", scale: 90 }, bleed);

  const realm = el("g", { mask: "url(#reveal)" });
  const g = el("g", { filter: "url(#wobble)" }, realm);
  const join = (arr) => arr.join(" ");
  el("path", { d: join(REALM.water), class: "water" }, g);
  el("path", { d: join(REALM.parks), class: "park" }, g);
  el("path", { d: join(REALM.coast), class: "coast" }, g);
  el("path", { d: join(REALM.minor), class: "st-minor" }, g);
  el("path", { d: join(REALM.mid), class: "st-mid" }, g);
  el("path", { d: join(REALM.major), class: "st-major" }, g);
  el("rect", { x: 14, y: 14, width: 1172, height: 972, class: "frame" }, realm);
  el("rect", { x: 22, y: 22, width: 1156, height: 956, class: "frame thin" }, realm);
  for (const [name, x, y, kind] of REALM.labels) {
    el("text", { x, y, "text-anchor": "middle", class: `label ${kind}` }).textContent = kind === "hood" ? name.replace("Marina District", "Marina").replace("Mission District", "Mission") : name;
  }
  // cartouche and compass
  const c = el("g", { class: "label", transform: "translate(160 930)" });
  el("rect", { x: -135, y: -42, width: 270, height: 62, rx: 4, class: "cartouche" }, c);
  el("text", { x: 0, y: -12, "text-anchor": "middle", class: "carto-title" }, c).textContent = "San Francisco";
  el("text", { x: 0, y: 10, "text-anchor": "middle", class: "carto-sub" }, c).textContent = "its streets, parks & byways";
  const k = el("g", { transform: "translate(1110 900)", class: "label" });
  el("circle", { r: 44, class: "compass" }, k);
  el("path", { d: "M0 -40 L7 -7 L40 0 L7 7 L0 40 L-7 7 L-40 0 L-7 -7 Z", class: "compass-star" }, k);
  el("text", { x: 0, y: -50, "text-anchor": "middle", "font-size": 15 }, k).textContent = "N";
  walkLayer = el("g", { class: "walkers" });
}

function reveal(to, ms, done) {
  const from = +revealCircle.getAttribute("r"), t0 = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    revealCircle.setAttribute("r", String(from + (to - from) * e));
    if (k < 1) requestAnimationFrame(step); else done && done();
  };
  requestAnimationFrame(step);
}

// ---------- footprints ----------
const state = WALKERS.map((w) => ({ ...w, seg: Math.floor(Math.random() * 4), t: 0, step: 0, dist: 0, banner: null, prints: [] }));
function footprint(x, y, ang, left) {
  const g = el("g", { transform: `translate(${x} ${y}) rotate(${ang})` }, walkLayer);
  const off = left ? -3.2 : 3.2;
  el("ellipse", { cx: off, cy: 0, rx: 2.5, ry: 4.2, class: "foot" }, g);
  el("circle", { cx: off, cy: -6, r: 1.6, class: "foot" }, g);
  return { g, born: performance.now() };
}
function banner(name) {
  const g = el("g", { class: "banner" }, walkLayer);
  const w = name.length * 7.2 + 18;
  el("path", { d: `M${-w / 2 - 8} -31 L${-w / 2} -24 L${-w / 2 - 8} -17 L${-w / 2} -17 L${-w / 2} -31 Z M${w / 2 + 8} -31 L${w / 2} -24 L${w / 2 + 8} -17 L${w / 2} -17 L${w / 2} -31 Z`, class: "tails" }, g);
  el("rect", { x: -w / 2, y: -34, width: w, height: 19, rx: 2 }, g);
  el("text", { x: 0, y: -20.5, "text-anchor": "middle" }, g).textContent = name;
  return g;
}
function tick(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  for (const w of state) {
    if (!w.banner) w.banner = banner(w.name);
    const n = w.path.length - 1;
    const a = w.path[w.seg % n], b = w.path[(w.seg % n) + 1];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    w.t += (w.speed * dt) / len;
    if (w.t >= 1) { w.t = 0; w.seg = (w.seg + 1) % n; continue; }
    const x = a[0] + (b[0] - a[0]) * w.t, y = a[1] + (b[1] - a[1]) * w.t;
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + 90;
    w.dist += w.speed * dt;
    if (w.dist > 11) { w.dist = 0; w.step ^= 1; w.prints.push(footprint(x, y, ang, w.step)); }
    w.banner.setAttribute("transform", `translate(${x} ${y})`);
    w.prints = w.prints.filter((p) => {
      const age = (now - p.born) / 1000;
      if (age > 5) { p.g.remove(); return false; }
      p.g.setAttribute("opacity", String(Math.max(0, 1 - age / 5)));
      return true;
    });
  }
  raf = requestAnimationFrame(tick);
}

// ---------- look around: drag to move, wheel or pinch to zoom ----------
const VB = { x: 0, y: 0, w: 1200, h: 1000 };
function setVB() { ink.setAttribute("viewBox", `${VB.x} ${VB.y} ${VB.w} ${VB.h}`); }
function zoomAt(f, cx, cy) {
  const nw = Math.min(1200, Math.max(240, VB.w * f)), k = nw / VB.w;
  VB.x = cx - (cx - VB.x) * k; VB.y = cy - (cy - VB.y) * k; VB.w = nw; VB.h = nw / 1.2; clamp(); setVB();
}
function clamp() { VB.x = Math.min(1200 - VB.w, Math.max(0, VB.x)); VB.y = Math.min(1000 - VB.h, Math.max(0, VB.y)); }
function toMap(ev) { const r = ink.getBoundingClientRect(); return [VB.x + (ev.clientX - r.left) / r.width * VB.w, VB.y + (ev.clientY - r.top) / r.height * VB.h]; }
const pts = new Map(); let pinch = 0;
ink.addEventListener("wheel", (e) => { if (!open) return; e.preventDefault(); const [x, y] = toMap(e); zoomAt(e.deltaY > 0 ? 1.15 : 1 / 1.15, x, y); }, { passive: false });
ink.addEventListener("pointerdown", (e) => { if (!open) return; ink.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
ink.addEventListener("pointermove", (e) => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  const r = ink.getBoundingClientRect();
  if (pts.size === 1) { VB.x -= (e.clientX - prev[0]) / r.width * VB.w; VB.y -= (e.clientY - prev[1]) / r.height * VB.h; clamp(); setVB(); return; }
  const [p1, p2] = [...pts.values()], d = Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
  if (pinch) { const mid = toMap({ clientX: (p1[0] + p2[0]) / 2, clientY: (p1[1] + p2[1]) / 2 }); zoomAt(pinch / d, mid[0], mid[1]); }
  pinch = d;
});
const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; };
ink.addEventListener("pointerup", up); ink.addEventListener("pointercancel", up);
ink.addEventListener("dblclick", () => { Object.assign(VB, { x: 0, y: 0, w: 1200, h: 1000 }); setVB(); });

// ---------- opening and closing ----------
let open = false;
function inkWrite(target, text, speed = 45) {
  target.innerHTML = "";
  [...text].forEach((ch, i) => { const s = document.createElement("span"); s.textContent = ch; target.appendChild(s); setTimeout(() => s.classList.add("on"), i * speed); });
}
function openMap() {
  if (open) return;
  open = true;
  note("");
  inkWrite($("#coverInk"), "Messrs. of the realm bid you welcome.\nDo tread softly.");
  setTimeout(() => {
    $("#book").style.display = "none";
    const m = $("#map");
    drawRealm();
    m.classList.add("show");
    m.classList.remove("closing", "inked", "unfolded");
    requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add("unfolded")));
    setTimeout(() => { ink.classList.add("inked"); reveal(980, 2600); }, 900);
    setTimeout(() => { last = 0; raf = requestAnimationFrame(tick); }, 2600);
    $("#wandLabel").textContent = "Speak to close it";
    $("#hint").textContent = "Drag to look around, pinch or scroll to zoom. Say the other words when you're done.";
  }, 2300);
}
function closeMap() {
  if (!open) return;
  open = false;
  const m = $("#map");
  ink.classList.add("closing");
  ink.classList.remove("inked");
  cancelAnimationFrame(raf);
  reveal(0, 1100);
  Object.assign(VB, { x: 0, y: 0, w: 1200, h: 1000 }); setVB();
  setTimeout(() => m.classList.remove("unfolded"), 900);
  setTimeout(() => {
    m.classList.remove("show");
    ink.classList.remove("closing");
    $("#book").style.display = "";
    inkWrite($("#coverInk"), "");
    $("#wandLabel").textContent = "Speak the words";
    $("#hint").textContent = "It only opens for those who know what to say.";
    note("Mischief managed.");
  }, 2300);
}
function note(t) { inkWrite($("#note"), t, 40); }
function heard(text) {
  $("#heard").textContent = text ? `“${text}”` : "";
  const n = norm(text);
  if (!open && OPEN.test(n)) return openMap();
  if (open && CLOSE.test(n)) return closeMap();
  if (n.length > 6) {
    $("#book").classList.remove("shake"); void $("#book").offsetWidth;
    if (!open) $("#book").classList.add("shake");
    note(open ? "The map waits for the proper words." : "The parchment stays blank. Try again.");
  }
}

// ---------- the voice ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function listen() {
  if (!SR) { $("#typed").classList.add("show"); $("#typedIn").focus(); note("Your browser can't hear you; write the words instead."); return; }
  if (listening) { rec.stop(); return; }
  rec = new SR();
  rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 3;
  rec.onstart = () => { listening = true; $("#wand").classList.add("listening"); $("#heard").textContent = "…"; };
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    const alts = [...r].map((a) => a.transcript);
    $("#heard").textContent = `“${alts[0]}”`;
    if (r.isFinal) heard(alts.find((a) => (open ? CLOSE : OPEN).test(norm(a))) || alts[0]);
  };
  rec.onerror = (e) => { if (e.error === "not-allowed") note("The map needs your microphone to hear you."); };
  rec.onend = () => { listening = false; $("#wand").classList.remove("listening"); };
  rec.start();
}
$("#wand").addEventListener("click", listen);
$("#typedGo").addEventListener("click", () => { heard($("#typedIn").value); $("#typedIn").value = ""; });
$("#typedIn").addEventListener("keydown", (e) => { if (e.key === "Enter") { heard(e.target.value); e.target.value = ""; } });
// Long-press the wand (or ?write in the URL) to write the words instead of speaking them.
let press; $("#wand").addEventListener("pointerdown", () => { press = setTimeout(() => $("#typed").classList.add("show"), 700); });
$("#wand").addEventListener("pointerup", () => clearTimeout(press));
if (location.search.includes("write")) $("#typed").classList.add("show");
</script>
