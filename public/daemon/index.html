<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A14">
<meta name="robots" content="noindex">
<meta name="description" content="Meet your daemon.">
<title>Your Dæmon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@600&display=swap">
<style>
/* Golden Dust in the dark, drifting toward you. Answer three questions; it flickers through shapes and settles into
   the animal that is you, and then it talks. */
:root { color-scheme: dark; --night: #0C0A14; --dust: #F3C969; --ink: #F1E7D2; --muted: #A79A82; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Cormorant Garamond", Georgia, serif; display: grid; justify-items: center; padding: 22px 16px 44px;
  background: radial-gradient(ellipse at 50% 30%, #241B33 0%, var(--night) 65%); }
canvas#dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
main { width: min(600px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; }
h1 { margin: 0; font: 600 clamp(30px, 7vw, 46px) "Cormorant SC", serif; letter-spacing: .05em; color: var(--dust); }
.sub { margin: 0; color: var(--muted); font-style: italic; font-size: 20px; }
.form { min-height: 1.4em; font: 600 clamp(36px, 10vw, 64px) "Cormorant SC", serif; color: var(--dust); text-shadow: 0 0 24px rgba(243,201,105,.6); transition: opacity .25s; }
.name { font-size: 22px; font-style: italic; min-height: 1.3em; }
.why { color: var(--muted); font-size: 19px; min-height: 1.3em; max-width: 46ch; }
.q { width: 100%; display: grid; gap: 6px; text-align: left; }
.q label { font-size: 19px; }
input { width: 100%; background: rgba(241,231,210,.05); border: 1px solid rgba(243,201,105,.3); border-radius: 12px; color: var(--ink); font: 19px "Cormorant Garamond", serif; padding: 10px 12px; }
button { border: 1px solid var(--dust); background: rgba(243,201,105,.08); color: var(--dust); font: 600 17px "Cormorant SC", serif; letter-spacing: .05em; padding: 10px 22px; border-radius: 999px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--dust); outline-offset: 3px; }
.talk { width: 100%; display: grid; gap: 10px; }
.log { display: grid; gap: 8px; text-align: left; max-height: 40vh; overflow-y: auto; }
.log p { margin: 0; font-size: 19px; line-height: 1.45; }
.log .d { color: var(--dust); } .log .me { color: var(--muted); font-style: italic; }
.row { display: flex; gap: 8px; } .row input { flex: 1; min-width: 0; }
.foot { font-size: 14px; color: rgba(241,231,210,.4); } .foot a { color: var(--dust); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<main>
  <h1>Your Dæmon</h1>
  <p class="sub" id="sub">Everyone has one. Yours hasn't settled yet.</p>
  <div class="form" id="form" aria-live="polite"></div>
  <div class="name" id="name"></div>
  <div class="why" id="why"></div>
  <form id="ask" class="q">
    <label>Where do you feel most yourself?<input id="a1" maxlength="200" placeholder="By the sea, in a workshop, in a crowd…"></label>
    <label>What do people get wrong about you?<input id="a2" maxlength="200"></label>
    <label>What would you do with a free, empty day?<input id="a3" maxlength="200"></label>
    <button type="submit">Let it settle</button>
  </form>
  <div class="talk" id="talk" hidden>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="row" id="say"><input id="said" maxlength="400" placeholder="Talk to your dæmon…" autocomplete="off"><button type="submit">Say</button></form>
  </div>
  <p class="foot">From the <a href="/magic/">Roadmap to Magic</a>. An AI chooses and voices your dæmon; nothing is kept.</p>
</main>
<script>
const API = "https://ubuntu-dev.tail89681.ts.net/api/public/spells/daemon";
const $ = (s) => document.querySelector(s);
const FLICKER = ["moth", "ferret", "cat", "hawk", "hare", "owl", "mouse", "wolf", "otter", "raven", "fox", "snake", "deer", "lizard", "heron"];
let me = null; const history = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function flicker(until) { let i = 0; while (!until()) { $("#form").textContent = FLICKER[i++ % FLICKER.length]; await wait(320); } }
$("#ask").addEventListener("submit", async (e) => {
  e.preventDefault();
  const answers = ["#a1", "#a2", "#a3"].map((s) => $(s).value.trim()).filter(Boolean); if (!answers.length) return;
  $("#ask").hidden = true; $("#sub").textContent = "It is changing, changing…"; let done = false; flicker(() => done);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answers }) });
    me = await r.json(); if (!r.ok) throw new Error(me.error || "The Dust scatters.");
  } catch (err) { done = true; $("#form").textContent = ""; $("#sub").textContent = err.message === "Failed to fetch" ? "The Dust scatters. Try again in a moment." : err.message; $("#ask").hidden = false; return; }
  done = true;
  for (const f of me.forms) { $("#form").textContent = f; await wait(520); }   // its last few shapes before it settles
  await wait(350);
  $("#form").textContent = me.animal; $("#name").textContent = `Its name is ${me.name}.`; $("#why").textContent = me.why;
  $("#sub").textContent = "It has settled."; target = 1; $("#talk").hidden = false;
  const hello = `${me.name} looks at you as if it has always known you.`;
  $("#log").innerHTML = `<p class="d">${hello}</p>`;
});
$("#say").addEventListener("submit", async (e) => {
  e.preventDefault(); const text = $("#said").value.trim(); if (!text || !me) return; $("#said").value = "";
  const p = document.createElement("p"); p.className = "me"; p.textContent = text; $("#log").append(p);
  const r0 = document.createElement("p"); r0.className = "d"; r0.textContent = "…"; $("#log").append(r0); $("#log").scrollTop = 1e9;
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ animal: me.animal, name: me.name, history, text }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "It is quiet.");
    r0.textContent = d.reply; history.push({ who: "me", text }, { who: "daemon", text: d.reply });
  } catch (err) { r0.textContent = err.message === "Failed to fetch" ? "(It can't hear you right now.)" : err.message; }
  $("#log").scrollTop = 1e9;
});
// Dust: drifts at random; once settled it gathers round the middle
const cv = $("#dust"), c = cv.getContext("2d"); let P = [], target = 0;
function size() { cv.width = innerWidth; cv.height = innerHeight; P = Array.from({ length: 260 }, () => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, vx: 0, vy: 0, r: Math.random() * 1.8 + .3 })); }
size(); addEventListener("resize", size);
(function loop(t) {
  c.clearRect(0, 0, cv.width, cv.height); const cx = cv.width / 2, cy = Math.min(cv.height * .3, 260);
  for (const p of P) {
    if (target) { const a = Math.atan2(p.y - cy, p.x - cx) + .02, d = Math.hypot(p.x - cx, p.y - cy), want = 90 + (p.r * 40) % 120; p.vx += ((cx + Math.cos(a) * want) - p.x) * .002; p.vy += ((cy + Math.sin(a) * want * .6) - p.y) * .002; }
    p.vx += (Math.random() - .5) * .06; p.vy += (Math.random() - .5) * .06 - .004; p.vx *= .96; p.vy *= .96; p.x += p.vx; p.y += p.vy;
    if (p.y < -5) p.y = cv.height + 5; if (p.x < -5) p.x = cv.width + 5; if (p.x > cv.width + 5) p.x = -5;
    c.fillStyle = `rgba(243,201,105,${.35 + .5 * Math.abs(Math.sin(t / 700 + p.r * 4))})`; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.3); c.fill();
  }
  requestAnimationFrame(loop);
})(0);
</script>
</body>
</html>
