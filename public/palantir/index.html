<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="robots" content="noindex">
<meta name="description" content="A seeing-stone that shows distant places.">
<title>The Palantír</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=EB+Garamond:ital@0;1&display=swap">
<style>
/* A black stone sphere on an iron stand. Ask for a place; a fire wakes in its heart, the smoke turns and parts, and
   the land appears as it was seen from orbit a day or two ago. */
:root { color-scheme: dark; --night: #050506; --ink: #E8E2D6; --muted: #8E8A80; --ember: #FF7A2A; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "EB Garamond", Georgia, serif; display: grid; justify-items: center; padding: 22px 14px 44px;
  background: radial-gradient(ellipse at 50% 40%, #1A1410 0%, var(--night) 60%); }
main { width: min(620px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; }
h1 { margin: 0; font: 600 clamp(28px, 6.4vw, 44px) "Cinzel", serif; letter-spacing: .08em; }
.sub { margin: 0; color: var(--muted); font-style: italic; font-size: 19px; }
.stand { position: relative; width: min(460px, 88vw); display: grid; justify-items: center; }
.orb { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 40% 35%, #1A1A22, #020203 70%);
  box-shadow: 0 0 0 2px rgba(255,255,255,.04), 0 30px 60px rgba(0,0,0,.8), inset 0 0 60px rgba(0,0,0,.9); }
.orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#land { opacity: 0; transition: opacity 2.2s ease; filter: saturate(1.1) contrast(1.05); }
.orb.seeing #land { opacity: 1; }
.orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.28), rgba(255,255,255,0) 22%), radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.85) 100%); }
.base { width: 46%; height: 46px; margin-top: -10px; background: linear-gradient(180deg, #2A2622, #0E0C0A); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); box-shadow: 0 10px 20px rgba(0,0,0,.6); }
form { display: flex; gap: 8px; width: 100%; }
input { flex: 1; min-width: 0; background: rgba(232,226,214,.05); border: 1px solid rgba(232,226,214,.22); border-radius: 999px; color: var(--ink); font: italic 20px "EB Garamond", serif; padding: 10px 18px; }
button { border: 1px solid rgba(255,122,42,.6); background: rgba(255,122,42,.08); color: #FFB27A; font: 600 15px "Cinzel", serif; letter-spacing: .08em; padding: 0 18px; border-radius: 999px; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid #FFB27A; outline-offset: 3px; }
.places { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.places button { padding: 6px 12px; font-size: 13px; }
.caption { min-height: 2.6em; color: var(--muted); font-style: italic; font-size: 18px; }
.caption b { color: var(--ink); font-style: normal; font-family: "Cinzel", serif; font-weight: 500; letter-spacing: .05em; }
.foot { font-size: 13px; color: rgba(232,226,214,.4); }
.foot a { color: #FFB27A; }
</style>
</head>
<body>
<main>
  <h1>The Palantír</h1>
  <p class="sub">Look into the stone, and name a place.</p>
  <div class="stand">
    <div class="orb" id="orb"><canvas id="land" width="768" height="768" aria-hidden="true"></canvas><canvas id="smoke" width="384" height="384" aria-hidden="true"></canvas></div>
    <div class="base"></div>
  </div>
  <form id="look"><input id="place" placeholder="Rivendell is not on the map. Try a real place…" aria-label="A place" autocomplete="off"><button type="submit">Gaze</button></form>
  <div class="places" id="places"></div>
  <p class="caption" id="caption" aria-live="polite"></p>
  <p class="foot">From the <a href="/magic/">Roadmap to Magic</a>. Imagery: NASA Worldview (GIBS), MODIS true colour from a recent day. Place names: OpenStreetMap via Photon.</p>
</main>
<script>
const $ = (s) => document.querySelector(s);
const PLACES = [["San Francisco", 37.77, -122.42], ["The Alps", 46.5, 9.5], ["The Nile Delta", 30.9, 31.1], ["Iceland", 64.9, -18.6], ["Tokyo", 35.68, 139.69],
  ["The Grand Canyon", 36.1, -112.1], ["New Zealand", -43.5, 171.5], ["The Sahara", 23.4, 12.5]];
$("#places").innerHTML = PLACES.map(([n]) => `<button type="button" data-p="${n}">${n}</button>`).join("");
const ZOOM = 6;
function day(back) { const d = new Date(Date.now() - back * 864e5); return d.toISOString().slice(0, 10); }
function tileXY(lat, lon, z) { const n = 2 ** z, x = (lon + 180) / 360 * n, r = lat * Math.PI / 180, y = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n; return [x, y]; }
function load(src) { return new Promise((res) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
async function see(name, lat, lon) {
  const orb = $("#orb"); orb.classList.remove("seeing"); $("#caption").textContent = "The stone stirs…"; burn = 1;
  const [fx, fy] = tileXY(lat, lon, ZOOM), cx = Math.floor(fx), cy = Math.floor(fy);
  const cv = $("#land"), c = cv.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, 768, 768);
  let date = null;
  for (const back of [1, 2, 3]) {   // the newest day with imagery
    const d = day(back); const jobs = [];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const x = ((cx + dx) % 2 ** ZOOM + 2 ** ZOOM) % 2 ** ZOOM, y = cy + dy;
      jobs.push(load(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${d}/GoogleMapsCompatible_Level9/${ZOOM}/${y}/${x}.jpg`).then((img) => [img, dx, dy]));
    }
    const got = await Promise.all(jobs);
    if (got.filter(([img]) => img).length >= 15) {
      const ox = (fx - cx) * 256, oy = (fy - cy) * 256;
      got.forEach(([img, dx, dy]) => { if (img) c.drawImage(img, 384 - 128 + dx * 256 - (ox - 128), 384 - 128 + dy * 256 - (oy - 128), 256, 256); });
      date = d; break;
    }
  }
  if (!date) { $("#caption").textContent = "The stone stays dark. Clouds, or the sky-watchers have not sent this day yet. Try again."; return; }
  setTimeout(() => { orb.classList.add("seeing"); burn = 0; }, 900);
  $("#caption").innerHTML = `<b>${name}</b>, as seen from orbit on ${new Date(date + "T12:00:00Z").toLocaleDateString(undefined, { month: "long", day: "numeric" })}.`;
}
async function geocode(q) {
  const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=1`); const d = await r.json();
  const f = d.features?.[0]; if (!f) throw new Error("The stone cannot find that place.");
  const [lon, lat] = f.geometry.coordinates; return [f.properties.name || q, lat, lon];
}
$("#look").addEventListener("submit", async (e) => { e.preventDefault(); const q = $("#place").value.trim(); if (!q) return;
  try { const [n, lat, lon] = await geocode(q); see(n, lat, lon); } catch (err) { $("#caption").textContent = err.message; } });
$("#places").addEventListener("click", (e) => { const b = e.target.closest("[data-p]"); if (!b) return; const p = PLACES.find((x) => x[0] === b.dataset.p); see(...p); });
// the smoke and the fire inside the stone
const sm = $("#smoke"), s = sm.getContext("2d"); let burn = 1, t = 0;
const puffs = Array.from({ length: 42 }, () => ({ a: Math.random() * 6.3, r: Math.random() * 150, v: (Math.random() - .5) * .01, size: 40 + Math.random() * 80 }));
(function loop() {
  t += .016; s.clearRect(0, 0, 384, 384);
  const k = burn ? 1 : Math.max(0, (sm.dataset.k = (+(sm.dataset.k || 1) - .012)));
  if (burn) sm.dataset.k = 1;
  for (const p of puffs) {
    p.a += p.v + .003; const x = 192 + Math.cos(p.a) * p.r, y = 192 + Math.sin(p.a * 1.3) * p.r * .8;
    const g = s.createRadialGradient(x, y, 0, x, y, p.size); g.addColorStop(0, `rgba(30,30,40,${.5 * k})`); g.addColorStop(1, "rgba(0,0,0,0)");
    s.fillStyle = g; s.fillRect(x - p.size, y - p.size, p.size * 2, p.size * 2);
  }
  if (burn) { const f = s.createRadialGradient(192, 205, 0, 192, 205, 70 + Math.sin(t * 6) * 8); f.addColorStop(0, "rgba(255,150,60,.55)"); f.addColorStop(.4, "rgba(255,90,20,.25)"); f.addColorStop(1, "rgba(0,0,0,0)"); s.fillStyle = f; s.fillRect(0, 0, 384, 384); }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
