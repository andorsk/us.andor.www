<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D08">
<meta name="robots" content="noindex">
<meta name="description" content="Choose a drink. The giant is waiting.">
<title>The Giant's Drink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* A game on a school's training computer: a giant behind a table, two cups, and a promise that one of them is safe.
   It watches how you play, and it is not a fair game. */
:root { color-scheme: dark; --screen: #0A0D08; --phos: #B6FF8A; --amber: #FFCE6B; --red: #FF6B6B; --ink: #E3F5D6; --muted: #7FA36A; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "VT323", monospace; display: grid; justify-items: center; padding: 22px 14px 44px;
  background: radial-gradient(ellipse at 50% 30%, #18210F 0%, var(--screen) 70%); }
main { width: min(720px, 100%); display: grid; gap: 12px; }
h1 { margin: 0; text-align: center; font: 400 clamp(16px, 4.6vw, 24px) "Press Start 2P", monospace; color: var(--phos); line-height: 1.5; }
.scene { position: relative; aspect-ratio: 1.4; border: 3px solid #2A3A1E; border-radius: 6px; overflow: hidden; background: linear-gradient(180deg, #20301A, #0E150A); image-rendering: pixelated; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px); }
.cup { cursor: pointer; } .cup:hover rect, .cup:focus rect { fill: #E7D8A6; }
.eye { cursor: default; } .eye.open { cursor: pointer; animation: twinkle 1.2s steps(2) infinite; }
@keyframes twinkle { 50% { fill: #FFF6B0; } }
.log { min-height: 5.2em; font-size: 22px; line-height: 1.25; color: var(--phos); white-space: pre-wrap; border: 1px solid #2A3A1E; border-radius: 6px; padding: 10px 12px; background: rgba(0,0,0,.35); }
.log .red { color: var(--red); } .log .amber { color: var(--amber); }
.stats { display: flex; justify-content: space-between; color: var(--muted); font-size: 20px; }
.again { justify-self: center; border: 2px solid var(--phos); background: none; color: var(--phos); font: 400 12px "Press Start 2P", monospace; padding: 10px 14px; cursor: pointer; }
.again:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.foot { text-align: center; font-size: 18px; color: rgba(227,245,214,.45); } .foot a { color: var(--phos); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>THE GIANT'S DRINK</h1>
  <div class="scene" id="scene">
    <svg viewBox="0 0 700 500" id="svg" aria-label="A giant behind a table with two cups">
      <g id="giant">
        <rect x="200" y="40" width="300" height="280" rx="120" fill="#C9A07A"/>
        <rect x="230" y="20" width="240" height="70" rx="35" fill="#B48A64"/>
        <rect x="270" y="140" width="40" height="30" fill="#FFFFFF"/><rect x="390" y="140" width="40" height="30" fill="#FFFFFF"/>
        <rect x="282" y="146" width="18" height="18" fill="#2A1A10" class="eye" id="eyeL"/><rect x="402" y="146" width="18" height="18" fill="#2A1A10" class="eye" id="eyeR"/>
        <rect x="330" y="180" width="40" height="50" fill="#B07A58"/>
        <path d="M270 250 h160 v14 h-20 v10 h-120 v-10 h-20 Z" fill="#6A2A20" id="mouth"/>
        <rect x="120" y="300" width="460" height="140" rx="30" fill="#7A5A3A"/>
        <rect x="140" y="320" width="80" height="40" rx="14" fill="#C9A07A"/><rect x="480" y="320" width="80" height="40" rx="14" fill="#C9A07A"/>
      </g>
      <rect x="0" y="380" width="700" height="120" fill="#3A2A18"/>
      <rect x="0" y="380" width="700" height="10" fill="#5A4024"/>
      <g class="cup" id="cupA" tabindex="0" role="button" aria-label="The left cup"><rect x="220" y="330" width="60" height="56" fill="#D8C48A"/><rect x="214" y="324" width="72" height="10" fill="#E7D8A6"/><rect x="232" y="340" width="36" height="8" fill="#7A3A8A"/></g>
      <g class="cup" id="cupB" tabindex="0" role="button" aria-label="The right cup"><rect x="420" y="330" width="60" height="56" fill="#D8C48A"/><rect x="414" y="324" width="72" height="10" fill="#E7D8A6"/><rect x="432" y="340" width="36" height="8" fill="#3A8A5A"/></g>
      <g id="you"><rect x="336" y="440" width="28" height="40" fill="#5AA0FF"/><rect x="340" y="424" width="20" height="18" fill="#F0C8A0"/></g>
    </svg>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="stats"><span id="tries">Attempts: 0</span><span id="mood">The giant is smiling.</span></div>
  <button class="again" id="again" type="button" hidden>PLAY AGAIN</button>
  <p class="foot">From the <a href="/magic/">Roadmap to Magic</a>. An adaptive game: it changes with how you play. Every choice you're offered is a trap.</p>
</main>
<script>
const $ = (s) => document.querySelector(s);
let tries = 0, over = false, picks = [];
const DEATHS = [
  "You drink. Your legs turn to jelly and you slide gently under the table. The giant laughs.",
  "You drink. The room spins, and spins, and you fall into the cup. The giant laughs louder.",
  "You drink. You feel very small, smaller, smaller still. The giant picks you up and examines you.",
  "You drink. Nothing happens. Then everything happens at once. The giant claps.",
  "You drink. Your boots turn to stone, then your knees. The giant yawns.",
];
function say(html) { $("#log").innerHTML = html; }
function intro() { say(`The giant leans over the table.\n<span class="amber">"Choose a drink, little one. One is poisoned, one will take you to Fairyland."</span>`); }
function drink(which) {
  if (over) return; tries++; picks.push(which);
  // It adapts: it moves the poison to wherever you're likely to choose (there's always poison wherever you choose).
  const line = DEATHS[(tries - 1) % DEATHS.length];
  $("#mouth").setAttribute("fill", "#9A2A20"); setTimeout(() => $("#mouth").setAttribute("fill", "#6A2A20"), 600);
  say(`You choose the ${which === "A" ? "purple" : "green"} cup.\n<span class="red">${line}</span>\n\n<span class="amber">"Choose again,"</span> says the giant.`);
  $("#tries").textContent = `Attempts: ${tries}`;
  const same = picks.slice(-3).every((p) => p === which) && picks.length >= 3;
  $("#mood").textContent = tries < 3 ? "The giant is smiling." : tries < 6 ? "The giant looks bored." : "The giant is very bored.";
  if (same) say($("#log").innerHTML + `\n<span class="amber">"Always the same cup? How predictable."</span>`);
  if (tries >= 4) { document.querySelectorAll(".eye").forEach((e) => e.classList.add("open")); $("#mood").textContent += " Its eye glints."; }
}
function climb() {
  if (over || tries < 4) return; over = true;
  say(`You don't drink. You climb the table, run up the giant's sleeve and leap at its glinting eye.\n<span class="amber">The giant roars and topples backwards. The table tips. The world behind it opens out: a land no one has seen before.</span>\n\n<span class="red">Nobody told you that you could do that.</span> That was the point.`);
  $("#giant").style.transition = "transform 1.6s ease-in"; $("#giant").style.transformOrigin = "350px 450px"; $("#giant").style.transform = "rotate(-80deg) translate(-200px, 120px)";
  $("#scene").style.background = "linear-gradient(180deg, #3A6A9A, #A6D06A)";
  $("#again").hidden = false;
}
$("#cupA").addEventListener("click", () => drink("A")); $("#cupB").addEventListener("click", () => drink("B"));
["#cupA", "#cupB"].forEach((s) => $(s).addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") drink(s === "#cupA" ? "A" : "B"); }));
document.querySelectorAll(".eye").forEach((e) => e.addEventListener("click", climb));
$("#again").addEventListener("click", () => { tries = 0; over = false; picks = []; $("#giant").style.transform = ""; $("#scene").style.background = ""; $("#again").hidden = true;
  document.querySelectorAll(".eye").forEach((e) => e.classList.remove("open")); $("#tries").textContent = "Attempts: 0"; $("#mood").textContent = "The giant is smiling."; intro(); });
intro();
</script>
</body>
</html>
