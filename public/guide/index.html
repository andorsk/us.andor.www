<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0B">
<meta name="robots" content="noindex">
<meta name="description" content="A pocket guide to everything.">
<title>The Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=VT323&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* A battered electronic book about the size of a paperback: a scuffed red-orange case, a glowing green screen, a
   keypad, and the two words on the cover that matter most. */
:root { color-scheme: dark; --space: #0B0D0B; --case: #C2421B; --case-2: #8E2A0E; --screen: #071407; --phos: #7CFF6B; --phos-dim: rgba(124,255,107,.55); --muted: #9AA89A; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--phos); font-family: "Space Grotesk", system-ui, sans-serif; display: grid; justify-items: center; padding: 22px 14px 44px;
  background: radial-gradient(ellipse at 50% 20%, #1A2A1A 0%, var(--space) 60%), var(--space); }
main { width: min(560px, 100%); display: grid; gap: 14px; }
.device { border-radius: 26px; padding: 18px; background: linear-gradient(160deg, #D6532A, var(--case) 40%, var(--case-2)); box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.18), inset 0 -4px 10px rgba(0,0,0,.35);
  display: grid; gap: 14px; }
.cover { text-align: center; font-family: "Rubik Mono One", sans-serif; color: #FFE2C9; font-size: clamp(30px, 9vw, 52px); line-height: 1; letter-spacing: .02em;
  text-shadow: 0 2px 0 #7A1E06, 0 0 18px rgba(255,200,150,.25); padding: 8px 0 2px; }
.screen { position: relative; border-radius: 12px; background: radial-gradient(ellipse at 50% 40%, #0E2A0E, var(--screen) 75%); min-height: 300px; padding: 16px 16px 12px;
  box-shadow: inset 0 0 0 3px #1A0A04, inset 0 0 40px rgba(0,0,0,.8); overflow: hidden; font-family: "VT323", ui-monospace, monospace; font-size: 23px; line-height: 1.25; }
.screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px); }
.head { color: var(--phos-dim); font-size: 18px; border-bottom: 1px dashed rgba(124,255,107,.3); padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
.entry { white-space: pre-wrap; text-shadow: 0 0 6px rgba(124,255,107,.55); min-height: 180px; }
.cursor { display: inline-block; width: 11px; height: 20px; background: var(--phos); vertical-align: -3px; animation: blink 1s steps(1) infinite; box-shadow: 0 0 8px var(--phos); }
@keyframes blink { 50% { opacity: 0; } }
form { display: flex; gap: 8px; }
input { flex: 1; min-width: 0; border-radius: 10px; border: 0; background: #1A0A04; color: var(--phos); font: 22px "VT323", monospace; padding: 10px 12px; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
input::placeholder { color: rgba(124,255,107,.4); }
button { border: 0; border-radius: 10px; background: linear-gradient(180deg, #F2E3C6, #C9B48E); color: #3A1A08; font: 700 15px "Space Grotesk", sans-serif; padding: 0 16px; cursor: pointer; box-shadow: 0 3px 0 #6E3A12; }
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6E3A12; }
button:focus-visible, input:focus-visible { outline: 2px solid #FFE2C9; outline-offset: 2px; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.keys button { height: 30px; font-size: 13px; }
.foot { font-size: 13px; color: var(--muted); text-align: center; }
.foot a { color: var(--phos); }
</style>
</head>
<body>
<main>
  <div class="device">
    <div class="cover" aria-label="Don't panic">DON'T PANIC</div>
    <div class="screen">
      <div class="head"><span>THE GUIDE · ENTRY</span><span id="clock"></span></div>
      <div class="entry" id="entry" aria-live="polite"></div>
    </div>
    <form id="ask"><input id="q" placeholder="Look something up…" maxlength="300" aria-label="Your question" autocomplete="off"><button type="submit">Look up</button></form>
    <div class="keys" aria-label="Popular entries">
      <button type="button" data-q="Towels">Towels</button><button type="button" data-q="Earth">Earth</button><button type="button" data-q="Tea">Tea</button>
      <button type="button" data-q="San Francisco">SF</button><button type="button" data-q="The meaning of life">Life</button>
    </div>
  </div>
  <p class="foot">From the <a href="/magic/">Roadmap to Magic</a>. Entries are written by an AI on the spot and aren't kept.</p>
</main>
<script>
const API = "https://ubuntu-dev.tail89681.ts.net/api/public/spells/guide";
const $ = (s) => document.querySelector(s);
let typing = 0;
function type(text) {
  const id = ++typing, el = $("#entry"); el.textContent = ""; const cur = document.createElement("span"); cur.className = "cursor";
  let i = 0;
  const step = () => { if (id !== typing) return; el.textContent = text.slice(0, i); el.append(cur); if (i++ < text.length) setTimeout(step, 16 + Math.random() * 18); };
  step();
}
async function look(q) {
  q = q.trim(); if (!q) return;
  type(`SEARCHING: ${q.toUpperCase()} …`);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Entry not found. Mostly harmless.");
    type(`${q.toUpperCase()}\n\n${d.text}`);
  } catch (e) { type(e.message === "Failed to fetch" ? "SIGNAL LOST SOMEWHERE NEAR BETELGEUSE. TRY AGAIN SHORTLY." : e.message.toUpperCase()); }
}
$("#ask").addEventListener("submit", (e) => { e.preventDefault(); look($("#q").value); });
document.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => { $("#q").value = b.dataset.q; look(b.dataset.q); }));
const tick = () => { $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }; tick(); setInterval(tick, 30000);
type("WELCOME, TRAVELLER. ENTRIES MAY BE INCOMPLETE, OUT OF DATE, OR CHEERFULLY WRONG. SOME ARE ALL THREE.\n\nTYPE A QUESTION, OR PRESS A KEY BELOW.");
</script>
</body>
</html>
