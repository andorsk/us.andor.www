<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --rule:#d1d9e0; --accent:#0969da; --err:#cf222e; }

  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; padding: 16px; }

  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: inherit; }
  button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: progress; }
  #err { color: var(--err); min-height: 1.5em; margin-top: 10px; font-size: .9rem; }
  footer { margin-top: 28px; color: var(--muted); font-size: .8rem; }

async function unlock(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.salt), iterations: D.iter, hash: "SHA-256" },

  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.ct));
  return new TextDecoder().decode(plain);

  try {
    const html = await unlock(pass);

    document.open(); document.write(html); document.close();
